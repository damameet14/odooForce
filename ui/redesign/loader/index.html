<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OF Logo Loader</title>
  <style>
    :root {
      --bg: #020101;
      --red: #d5675d;
      --cream: #ffd6b2;
      --size: min(44vw, 210px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .loader-shell {
      position: relative;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at 50% 48%, rgba(213, 103, 93, .14), transparent 230px),
        var(--bg);
      isolation: isolate;
    }

    .loader-shell::before {
      content: "";
      position: absolute;
      width: min(58vw, 330px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 118, 72, .2), transparent 64%);
      filter: blur(18px);
      opacity: .65;
      animation: ambient 2.4s ease-in-out infinite;
      z-index: -1;
    }

    .loader {
      width: var(--size);
      aspect-ratio: 1;
      overflow: visible;
      filter:
        drop-shadow(0 14px 22px rgba(0, 0, 0, .68))
        drop-shadow(0 0 16px rgba(213, 103, 93, .22));
      animation: logoFloat 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    .piece {
      transform-box: fill-box;
      transform-origin: center;
      filter: url(#softShadow);
    }

    .top-left {
      animation: topLeft 2.4s cubic-bezier(.2, .9, .2, 1) infinite;
    }

    .top-right {
      animation: topRight 2.4s cubic-bezier(.2, .9, .2, 1) infinite;
    }

    .o-piece {
      animation: oSet 2.4s cubic-bezier(.2, .9, .2, 1) infinite;
    }

    .f-piece {
      animation: fSet 2.4s cubic-bezier(.2, .9, .2, 1) infinite;
    }

    .top-left,
    .top-right {
      fill: var(--cream);
    }

    .o-piece,
    .f-piece {
      fill: var(--red);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @keyframes ambient {
      0%, 100% { opacity: .42; transform: scale(.94); }
      50% { opacity: .72; transform: scale(1.06); }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(.985); opacity: .9; }
      50% { transform: translateY(-4px) scale(1.025); opacity: 1; }
    }

    @keyframes topLeft {
      0%, 100% { transform: translate(-8px, -14px); opacity: .62; }
      38%, 68% { transform: translate(0, 0); opacity: 1; }
    }

    @keyframes topRight {
      0%, 100% { transform: translate(9px, -14px); opacity: .62; }
      42%, 70% { transform: translate(0, 0); opacity: 1; }
    }

    @keyframes oSet {
      0%, 100% { transform: translate(-10px, 7px); opacity: .62; }
      34%, 72% { transform: translate(0, 0); opacity: 1; }
    }

    @keyframes fSet {
      0%, 100% { transform: translate(10px, 7px); opacity: .62; }
      38%, 74% { transform: translate(0, 0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="loader-shell" aria-label="Loading">
    <span class="sr-only">Loading Odoo Force</span>

    <svg class="loader" viewBox="0 0 180 180" role="img" aria-label="OF logo loader">
      <defs>
        <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity=".36"/>
          <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff765b" flood-opacity=".18"/>
        </filter>
      </defs>

      <path class="piece top-left" d="M114 22 L114 25 L56 58 L27 45 L28 42 L86 14 L97 14 Z"/>
      <path class="piece top-right" d="M157 41 L156 45 L98 75 L87 74 L63 62 L64 59 L121 26 Z"/>
      <path class="piece o-piece" fill-rule="evenodd" d="M21 53 L30 52 L51 62 L51 77 L57 76 L60 81 L63 68 L89 83 L92 90 L92 163 L88 168 L78 168 L21 137 L18 130 L18 58 Z M73 142 L72 94 L46 80 L36 79 L36 124 L40 129 L66 142 Z"/>
      <path class="piece f-piece" d="M165 48 L163 66 L126 84 L121 90 L122 105 L158 87 L159 103 L121 124 L121 158 L102 169 L100 89 L103 81 L115 71 L161 47 Z"/>
    </svg>
  </main>
</body>
</html>
